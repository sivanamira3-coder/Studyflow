<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --bg-outer:#E9EBEF; --surface:#FFFFFF; --surface-2:#F0F2F5;
  --ink:#13212B; --ink-2:#4E5B68; --ink-3:#7B8794; --line:#E3E6EB; --track:#E6EAEE;
  --primary:#0F8B7D; --primary-ink:#FFFFFF; --primary-soft:#E1F3F0; --primary-deep:#0B5C54;
  --hero:#0B5C54; --hero-2:#0E6F65;
  --ok:#2E8B57; --ok-soft:#E3F3EA; --warn:#B7791F; --warn-soft:#FBF1DC; --err:#C2413A; --err-soft:#FBE7E5;
  --exam-bg:#FBE8E3; --exam-fg:#B04A32;
  --quiz-bg:#FBF0D6; --quiz-fg:#956608;
  --assignment-bg:#E3ECFA; --assignment-fg:#2D579F;
  --project-bg:#ECE6FA; --project-fg:#5B44A6;
  --homework-bg:#F8E6EF; --homework-fg:#A0386B;
  --other-bg:#E9ECF0; --other-fg:#56606D;
  --task-bg:#E4F0EC; --task-fg:#2A6F60;
  --shadow:0 1px 2px rgba(19,33,43,.05),0 6px 18px rgba(19,33,43,.05);
  --shadow-lg:0 -8px 40px rgba(19,33,43,.18);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1417; --bg-outer:#080C0E; --surface:#161E22; --surface-2:#1D272C;
    --ink:#EAF0F2; --ink-2:#B3BFC6; --ink-3:#7F8D96; --line:#26323A; --track:#26323A;
    --primary:#3CBFAB; --primary-ink:#06231F; --primary-soft:#12302C; --primary-deep:#3CBFAB;
    --hero:#0F4A44; --hero-2:#136058;
    --ok:#5CC48A; --ok-soft:#14302267; --warn:#E0B054; --warn-soft:#3A2F14; --err:#EE7C74; --err-soft:#3B1C1A;
    --exam-bg:#3B211B; --exam-fg:#F2A08A; --quiz-bg:#38300F; --quiz-fg:#E6C15A;
    --assignment-bg:#1B2842; --assignment-fg:#9DBBF0; --project-bg:#2A2144; --project-fg:#BBA8F0;
    --homework-bg:#3B1F2E; --homework-fg:#F0A0C4; --other-bg:#232B31; --other-fg:#A6B1BA;
    --task-bg:#16302B; --task-fg:#7CCBB9;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 -8px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1417; --bg-outer:#080C0E; --surface:#161E22; --surface-2:#1D272C;
  --ink:#EAF0F2; --ink-2:#B3BFC6; --ink-3:#7F8D96; --line:#26323A; --track:#26323A;
  --primary:#3CBFAB; --primary-ink:#06231F; --primary-soft:#12302C; --primary-deep:#3CBFAB;
  --hero:#0F4A44; --hero-2:#136058;
  --ok:#5CC48A; --ok-soft:#143022; --warn:#E0B054; --warn-soft:#3A2F14; --err:#EE7C74; --err-soft:#3B1C1A;
  --exam-bg:#3B211B; --exam-fg:#F2A08A; --quiz-bg:#38300F; --quiz-fg:#E6C15A;
  --assignment-bg:#1B2842; --assignment-fg:#9DBBF0; --project-bg:#2A2144; --project-fg:#BBA8F0;
  --homework-bg:#3B1F2E; --homework-fg:#F0A0C4; --other-bg:#232B31; --other-fg:#A6B1BA;
  --task-bg:#16302B; --task-fg:#7CCBB9;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 -8px 40px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg-outer);color:var(--ink);font-family:Rubik,Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media (min-width:700px){#app{border-inline:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 132px;scroll-behavior:smooth;overscroll-behavior:contain}
.screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.greet{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.date{color:var(--ink-2);font-size:14.5px;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--primary);flex:none}
.h1{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.h2{font-size:19px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between}
.h2 .link{font-size:14px;font-weight:500;color:var(--primary)}
.muted{color:var(--ink-2)} .xs{font-size:13px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card.click{cursor:pointer;transition:transform .15s}
.card.click:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.25}
.stat span{color:var(--ink-2);font-size:13.5px}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero-2),var(--hero));color:#fff;border-radius:28px;padding:22px 20px 20px;box-shadow:0 10px 30px rgba(11,92,84,.28)}
.hero .eyebrow{font-size:14px;opacity:.85;display:flex;align-items:center;gap:8px}
.hero h2{font-size:28px;font-weight:600;line-height:1.2;margin:8px 0 2px;letter-spacing:-.01em}
.hero .sub{opacity:.85;font-size:15px}
.hero .meta{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 12px;font-size:14px;margin-top:12px}
.hero .list{margin:16px 0 18px;display:grid;gap:8px}
.hero .hrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;min-height:52px}
.hero .hrow.done .ht{text-decoration:line-through;opacity:.65}
.hero .chk{border-color:rgba(255,255,255,.7)}
.hero .chk.on{background:#fff;color:var(--hero);border-color:#fff}
.hero .ht{flex:1;min-width:0;font-size:15.5px}
.hero .hm{font-size:13px;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;font-weight:600;font-size:16px;transition:transform .12s,background .2s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.soft{background:var(--primary-soft);color:var(--primary-deep)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--err-soft);color:var(--err)}
.btn.light{background:#fff;color:var(--hero)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.tbtn{color:var(--primary);font-weight:500;padding:10px;min-height:44px}

/* checkbox */
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;font-size:16px;transition:background .18s,border-color .18s,transform .18s;color:transparent;position:relative}
.chk::after{content:"";position:absolute;inset:-9px}
.chk.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chk.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 4px;min-height:60px}
.task + .task{border-top:1px solid var(--line)}
.task .tb{flex:1;min-width:0;cursor:pointer}
.tt{font-size:16px;font-weight:500}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.tm{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fg,var(--ink-3));display:inline-block;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--bg,var(--other-bg));color:var(--fg,var(--other-fg))}
.tp-exam{--bg:var(--exam-bg);--fg:var(--exam-fg)} .tp-quiz{--bg:var(--quiz-bg);--fg:var(--quiz-fg)}
.tp-assignment{--bg:var(--assignment-bg);--fg:var(--assignment-fg)} .tp-project{--bg:var(--project-bg);--fg:var(--project-fg)}
.tp-homework{--bg:var(--homework-bg);--fg:var(--homework-fg)} .tp-other{--bg:var(--other-bg);--fg:var(--other-fg)}
.tp-task{--bg:var(--task-bg);--fg:var(--task-fg)}
.imp{color:var(--warn)}

/* progress */
.bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.pct{font-weight:600;font-size:14px;min-width:38px;text-align:end}

/* segments & chips */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:center;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep);font-weight:500}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}

/* banners */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:14px 16px;margin-top:12px;font-size:15px}
.note .i{font-size:22px;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--primary-soft);color:var(--primary-deep)}
.note.err{background:var(--err-soft);color:var(--err)}
.note .nb{flex:1;color:var(--ink)} .note .nb b{display:block;font-weight:600}
.note .btn{margin-top:10px}
.offline{background:var(--ink);color:var(--bg);text-align:center;font-size:14px;padding:8px 12px}

/* nav */
#nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px;flex:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:14px;color:var(--ink-3);font-size:12px;font-weight:500;transition:color .2s}
#nav button .i{font-size:24px}
#nav button.on{color:var(--primary)}
#nav button.on .ni{background:var(--primary-soft)}
.ni{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
#fab{position:absolute;inset-inline-end:20px;bottom:88px;width:58px;height:58px;border-radius:20px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:28px;box-shadow:0 10px 24px rgba(15,139,125,.4);z-index:20;transition:transform .15s}
#fab:active{transform:scale(.92)}
#fab.hide{display:none}
#pill{position:absolute;inset-inline:20px;bottom:88px;margin-inline-end:80px;z-index:19;background:var(--ink);color:var(--bg);border-radius:18px;min-height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:500}
#pill[hidden]{display:none}
#pill .pt{font-variant-numeric:tabular-nums;font-size:18px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:600;margin-bottom:14px}
.modal{position:fixed;inset:0;z-index:60;background:var(--bg);max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.modal{border-inline:1px solid var(--line)}}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex:none}
.mhead h2{flex:1;font-size:20px;font-weight:600;margin:0}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface-2)}
.mbody{flex:1;overflow-y:auto;padding:8px 20px 24px}
.mfoot{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:grid;gap:8px;flex:none}
#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast>div{pointer-events:auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease}
#toast button{color:var(--primary);font-weight:600;filter:brightness(1.4)}

/* forms */
.field{margin-bottom:20px}
.label{display:block;font-weight:500;font-size:15px;margin-bottom:8px}
.label small{font-weight:400;color:var(--ink-3);margin-inline-start:6px}
.input,.textarea,.select{width:100%;min-height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.textarea{min-height:150px;resize:vertical;line-height:1.55}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.ferr{color:var(--err);font-size:14px;margin-top:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{text-align:center;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:18px;transition:all .15s}
.scale button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep)}
.scalelbl{font-size:14px;color:var(--ink-2);margin-top:8px;min-height:22px}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typecard{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .12s}
.typecard:active{transform:scale(.97)}
.typecard .ti{width:38px;height:38px;border-radius:12px;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-size:20px}
.typecard b{font-weight:600}
.typecard span{font-size:13px;color:var(--ink-2);line-height:1.35}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:13px;color:var(--ink-3);padding:6px 0}
.cal .day{aspect-ratio:1/1.08;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15.5px;position:relative;min-height:44px}
.cal .day.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cal .day.sel{background:var(--primary);color:var(--primary-ink);font-weight:600}
.cal .day.other{opacity:.35}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fg)}
.day.sel .dots i{background:var(--primary-ink)}
.dots i.sq{border-radius:2px;background:var(--ink-3)}
.agenda-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--bg);border-inline-start:4px solid var(--fg);margin-top:8px;cursor:pointer}
.agenda-item.plain{background:var(--surface-2);border-inline-start-color:var(--line);cursor:default}
.wk h3{font-size:15px;font-weight:600;margin:18px 0 4px;display:flex;justify-content:space-between}
.wk h3.today{color:var(--primary)}
.time{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13.5px;min-width:44px}

/* study/timer */
.ringwrap{position:relative;width:260px;height:260px;margin:12px auto 20px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:12;stroke-linecap:round}
.ringwrap .trk{stroke:var(--track)} .ringwrap .prg{stroke:var(--primary);transition:stroke-dashoffset .4s linear}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:54px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ringtxt span{color:var(--ink-2);font-size:14.5px;margin-top:8px}
.ctrls{display:flex;gap:12px;justify-content:center}
.wbars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.wbars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wbars .b{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--primary);min-height:4px;transition:height .6s}
.wbars .b.over{background:var(--warn)}
.wbars small{font-size:12px;color:var(--ink-3)}

/* AI */
.chat{display:flex;flex-direction:column;gap:12px;margin:8px 0 12px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.6;font-size:15.5px;word-wrap:break-word}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px;align-self:flex-start}
.msg.me{background:var(--primary);color:var(--primary-ink);border-end-end-radius:6px;align-self:flex-end}
.msg p{margin:0 0 6px} .msg ul,.msg ol{margin:4px 0 6px;padding-inline-start:22px} .msg li{margin:2px 0}
.msg .src{font-size:12px;color:var(--ink-3);margin-top:6px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.composer textarea{flex:1;min-height:52px;max-height:120px;border:1.5px solid var(--line);border-radius:18px;padding:13px 16px;resize:none;background:var(--surface);font-size:16px;line-height:1.4}
.composer textarea:focus{outline:none;border-color:var(--primary)}
.send{width:52px;height:52px;border-radius:18px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:22px;flex:none}

.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}

.score{font-size:64px;font-weight:600;text-align:center;line-height:1;margin:14px 0 6px}

.empty p{color:var(--ink-2);margin-bottom:20px;max-width:320px;margin-inline:auto}

.switch{width:52px;height:32px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--primary)}

.plan-day li{font-size:15px;color:var(--ink-2);margin:3px 0}
.plan-day ul{margin:0;padding-inline-start:20px}

.sep{height:1px;background:var(--line);margin:14px 0}
.slot{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.slot .input{min-height:46px}
.tabs-days{display:flex;gap:6px;margin-bottom:12px}
.tabs-days button{flex:1;min-height:44px;border-radius:12px;background:var(--surface-2);font-weight:500;text-align:center}
.tabs-days button.on{background:var(--primary);color:var(--primary-ink)}

.ob{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.ob .vis{flex:0 0 auto;height:230px;display:grid;place-items:center;margin-top:16px}
.ob-scroll{flex:1;overflow-y:auto}
.ob h1{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:14px 0 10px}
.ob p{color:var(--ink-2);font-size:17.5px;line-height:1.55}
.pdots{display:flex;gap:6px;justify-content:center;margin:0 0 18px}
.pdots i{width:8px;height:8px;border-radius:9px;background:var(--track);transition:all .3s}
.pdots i.on{width:26px;background:var(--primary)}
.viscard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;width:100%;max-width:320px;box-shadow:var(--shadow)}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.vrow + .vrow{border-top:1px solid var(--line)}
.vbar{flex:1}
.bubble{padding:10px 14px;border-radius:16px;font-size:15px;max-width:85%}
.bubble.a{background:var(--surface-2);border-end-start-radius:4px}
.bubble.u{background:var(--primary);color:var(--primary-ink);border-end-end-radius:4px;margin-inline-start:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function suggestTimes(d) {
  const wd = parseD(d).getDay(); const acts = S.schedule.filter(a => a.day === wd).map(a => [hm2min(a.s), hm2min(a.e)]);
  const slots = S.prefs.slots.map(s => [hm2min(s.s), hm2min(s.e)]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
  const out = {}; let si = 0, cur = slots.length ? slots[0][0] : 0; const f = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  tasksOn(d).filter(x => !x.done).forEach(x => {
    while (si < slots.length) {
      acts.forEach(([a, b]) => { if (cur < b && cur + x.minutes > a) cur = Math.max(cur, b); });
      if (cur + x.minutes <= slots[si][1]) { out[x.id] = f(cur); cur += x.minutes; return; }
      si++; if (si < slots.length) cur = slots[si][0];
    }
  });

}

function vTasks() {

function statsHTML() {

  const r = $('#tmRing'); if (r) r.setAttribute('stroke-dashoffset', RING * (TM.rem / TM.dur));

}

}

  if (p === 'availability') { title = t('availability'); b = `<div class="field"><span class="label">${t('daily_time')}</span>${chipGroup('setMinutes', t('opts_time_short'), P.varies ? 0 : P.dailyMinutes)}</div><span class="label">${t('study_slots')}</span>${P.slots.map((s, i) => `<div class="slot"><input class="input" type="time" data-slot="${i}" data-side="s" value="${s.s}" aria-label="${t('from')}"><span>–</span><input class="input" type="time" data-slot="${i}" data-side="e" value="${s.e}" aria-label="${t('to')}"><button class="icon-btn" data-act="delSlot" data-i="${i}" aria-label="${t('delete')}">${ic('trash', 20)}</button></div>`).join('')}<button class="btn soft sm" data-act="addSlot">${ic('plus', 16)} ${t('add_slot')}</button>`; }
  if (p === 'schedule') { const d = UI.schedDay ?? new Date().getDay(); title = t('weekly_sched'); b = `<div class="tabs-days" role="tablist">${t('wd').map((w, i) => `<button class="${d === i ? 'on' : ''}" role="tab" aria-selected="${d === i}" data-act="schedDay" data-v="${i}" aria-label="${t('wdl')[i]}">${w}</button>`).join('')}</div>${S.schedule.filter(a => a.day === d).sort((a, b) => a.s.localeCompare(b.s)).map(a => `<div class="card" style="margin-bottom:10px"><div class="row"><input class="input grow" data-act-in="actname" data-id="${a.id}" value="${esc(a.name)}" aria-label="${t('act_name')}"><button class="icon-btn" data-act="delAct" data-id="${a.id}" aria-label="${t('delete')}">${ic('trash', 20)}</button></div><div class="slot" style="margin:10px 0 0"><input class="input" type="time" data-act-in="acts" data-id="${a.id}" value="${a.s}"><span>–</span><input class="input" type="time" data-act-in="acte" data-id="${a.id}" value="${a.e}"></div></div>`).join('') || `<div class="muted" style="padding:10px 2px">${t('nothing_day')}</div>`}<div class="sep"></div><span class="label">${t('add_act')}</span><div class="chips">${t('act_kinds').map((k, i) => `<button class="chip" data-act="addAct" data-v="${i}">${ic('plus', 14)} ${k}</button>`).join('')}</div>`; }
  if (p === 'aiprefs') { title = t('ai_prefs'); b = `<div class="card" style="padding:4px 14px">${switchRow(t('ai_on'), P.ai.enabled, 'aiSw')}</div><p class="hint">${aiAvailable() ? t('ai_status_on') : t('ai_status_off')}</p><div class="field" style="margin-top:16px"><span class="label">${t('ai_style')}</span><div class="seg">${[['steps', 'style_steps'], ['short', 'style_short']].map(([k, l]) => `<button class="${P.ai.style === k ? 'on' : ''}" data-act="aiStyle" data-v="${k}">${t(l)}</button>`).join('')}</div></div>`; }
  if (p === 'privacy') { title = t('privacy'); b = `<div class="card"><b>${t('priv_t')}</b><p class="muted" style="margin-top:6px">${t('priv_d')}</p></div><div style="display:grid;gap:10px;margin-top:16px">${S.demo ? `<button class="btn soft block" data-act="clearDemo">${t('clear_demo')}</button>` : ''}<button class="btn danger block" data-act="resetAll">${t('reset_all')}</button></div>`; }
  if (p === 'account') {
    title = t('account'); const a = S.user.account;
    b = a ? `<div class="card"><div class="muted xs">${t('signed_as')}</div><b>${esc(a.email)}</b></div><button class="btn ghost block" style="margin-top:14px" data-act="logout">${t('logout')}</button>`
      : `<div class="note info">${ic('info')}<div class="nb"><b>${t('acc_guest')}</b>${t('acc_guest_d')}</div></div><div style="margin-top:18px"><div class="field"><label class="label" for="a_mail">${t('email')}</label><input class="input" id="a_mail" type="email" autocomplete="email" dir="ltr"></div><div class="field"><label class="label" for="a_pw">${t('password')}</label><input class="input" id="a_pw" type="password" autocomplete="current-password" dir="ltr"></div><div class="grid2"><button class="btn primary" data-act="signup">${t('signup')}</button><button class="btn ghost" data-act="signup">${t('login')}</button></div><div class="ferr" id="aerr" role="alert"></div></div>`;
  }
  modal(title, b, '', true);
}

/* ---------- onboarding ---------- */
const OB = { step: 0, time: 60 };
function obHTML() {
  const s = OB.step; const vis = [
    `<div class="viscard">${[['מתמטיקה', 60], ['אנגלית', 40], ['היסטוריה', 20]].map(([n, p]) => `<div class="vrow"><b style="min-width:70px">${n}</b><div class="bar vbar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>`).join('')}</div>`,
    `<div class="viscard"><div class="row between xs muted" style="margin-bottom:8px"><span>היום</span><span>35 דק׳</span></div>${['לחזור על אוצר מילים', 'תרגול שאלות', 'חזרה קצרה'].map((x, i) => `<div class="vrow"><span class="chk ${i === 0 ? 'on' : ''}" style="width:24px;height:24px;font-size:14px">${ic('check')}</span><span>${x}</span></div>`).join('')}</div>`,
    `<div class="viscard" style="display:grid;gap:8px"><div class="bubble u">תסביר לי נגזרות</div><div class="bubble a">בשמחה! נגזרת מודדת קצב שינוי. נתחיל בדוגמה קטנה?</div><div class="bubble u">כן</div></div>`
  ];
  const dots = `<div class="pdots">${[0, 1, 2, 3].map(i => `<i class="${i === s ? 'on' : ''}"></i>`).join('')}</div>`;
  if (s < 3) return `<div class="ob"><div class="row" style="justify-content:flex-end;min-height:44px">${`<button class="tbtn" data-act="obSkip">${t('skip')}</button>`}</div><div class="ob-scroll"><div class="vis">${vis[s]}</div><h1>${t('ob' + (s + 1) + '_t')}</h1><p>${t('ob' + (s + 1) + '_d')}</p></div>${dots}<button class="btn primary block" data-act="obNext">${t('next')}</button></div>`;
  return `<div class="ob"><div class="row" style="min-height:44px"><button class="icon-btn" data-act="obBack" aria-label="חזרה">${ic('back')}</button></div><div class="ob-scroll"><h1 style="margin-top:20px">${t('ob4_t')}</h1><div class="chips" style="margin-top:22px">${t('opts_time').map(([l, v]) => `<button class="chip ${OB.time === v ? 'on' : ''}" data-act="obTime" data-v="${v}" aria-pressed="${OB.time === v}">${l}</button>`).join('')}</div></div>${dots}<button class="btn primary block" data-act="obDone">${t('lets_go')}</button></div>`;
}

/* ---------- actions ---------- */
const ACT = {
  nav: el => { UI.tab = el.dataset.v; if (UI.tab !== 'ai') UI.quiz = UI.quiz && UI.quiz.done ? null : UI.quiz; closeSheet(); render(false); },
  add: () => addSheet(), addType: el => openForm(el.dataset.v),
  scrim: (el, e) => { if (e.target === el) closeSheet(); }, scrimC: (el, e) => { if (e.target === el) hideLayer('confirm'); },
  closeSheet: () => closeSheet(), closeModal: () => { if (UI.set) return settingsPage(null); hideLayer('modal'); refresh(); },
  cfNo: () => hideLayer('confirm'), cfYes: () => { hideLayer('confirm'); UI.cf && UI.cf(); },
  pick: el => {
    const g = el.dataset.g, v = el.dataset.v; F[g] = v;
    document.querySelectorAll(`[data-g="${g}"]`).forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (g === 'subject') { const c = $('#subjCustom'); if (c) c.style.display = v === '__other' ? '' : 'none'; if (v === '__other') { const i = c && $('input', c); i && i.focus(); } }
    if (g === 'confidence') { const l = $('#confLbl'); if (l) l.textContent = t('conf' + v); }
    if (g === 'setMinutes') { const n = +v; S.prefs.varies = n === 0; if (n) S.prefs.dailyMinutes = n; save(); }
    if (['minutes', 'importance'].includes(g)) F[g] = +v;
  },
  quickDate: el => { const d = addD(todayS(), +el.dataset.v); F.date = d; const i = $('#f_date'); if (i) i.value = d; },
  submit: el => submit(el.dataset.mode),
  retryPlan: () => { hideLayer('loader'); const p = UI.pending; if (p) planFlow(p.ev, p.replace); },
  manualPlan: () => { hideLayer('loader'); const p = UI.pending; if (p && !p.replace) { S.events.push(p.ev); save(); hideLayer('modal'); render(); eventSheet(p.ev.id, false); } },
  toggle: el => {
    const x = S.tasks.find(y => y.id === el.dataset.id); if (!x) return; x.done = !x.done; x.doneAt = x.done ? todayS() : null; save();
    el.classList.toggle('on', x.done); el.classList.add('pop'); el.setAttribute('aria-checked', x.done);
    setTimeout(() => {
      refresh();
      if (x.done) { const ev = x.eventId && evById(x.eventId); if (ev && tasksOf(ev.id).every(y => y.done)) toast(t('all_done_ev')); else toast(t('task_done_toast') + ' ✓', t('undo'), () => { x.done = false; x.doneAt = null; save(); refresh(); }); }
    }, 260);
  },
  openTask: el => taskSheet(el.dataset.id),
  saveTask: el => { const x = S.tasks.find(y => y.id === el.dataset.id); if (!x) return; x.title = (F.title || x.title).trim() || x.title; x.date = F.date || x.date; x.minutes = +F.minutes || x.minutes; x.importance = +F.importance || x.importance; save(); closeSheet(); render(); toast(t('save') + ' ✓'); },
  delTask: el => confirmDlg(t('confirm_del'), t('yes_del'), () => { S.tasks = S.tasks.filter(y => y.id !== el.dataset.id); save(); closeSheet(); render(); }),
  openEvent: el => eventSheet(el.dataset.id, !!el.dataset.plan),
  evPlan: el => eventSheet(el.dataset.id, true, false), evBack: el => eventSheet(el.dataset.id, false, false),
  regen: el => { const ev = evById(el.dataset.id); if (!ev) return; closeSheet(); if (ev.type === 'exam' || ev.type === 'quiz') { if (diffD(ev.date, todayS()) < 0) return; } planFlow(ev, true); },
  delEvent: el => confirmDlg(t('confirm_del'), t('yes_del'), () => { const id = el.dataset.id; S.events = S.events.filter(e => e.id !== id); S.tasks = S.tasks.filter(x => x.eventId !== id); save(); closeSheet(); render(); }, t('confirm_del_ev')),
  goToday: () => { closeSheet(); UI.tab = 'today'; render(false); }, goCal: el => { closeSheet(); UI.tab = 'cal'; UI.cal.sel = el.dataset.d; render(false); },
  goStudy: () => { UI.tab = 'study'; UI.seg = 'exams'; render(false); },
  optimize: () => runOptimize(), optimizeClose: () => { closeSheet(); runOptimize(); },
  pull: () => { const T = todayS(); const nx = liveTasks().filter(x => !x.done && x.date > T && x.date <= addD(T, 4)).sort((a, b) => a.date.localeCompare(b.date))[0]; if (nx) { nx.date = T; save(); refresh(); toast(nx.title); } else toast(t('done_day_d')); },
  viewNotice: () => movedSheet(), dismissNotice: () => { if (S.notice) S.notice.dismissed = true; save(); render(); },
  calView: el => { UI.cal.view = el.dataset.v; render(); }, calSel: el => { UI.cal.sel = el.dataset.d; render(); },
  calToday: () => { UI.cal.sel = todayS(); render(); },
  calNav: el => { const n = +el.dataset.v, c = UI.cal, d = parseD(c.sel); if (c.view === 'month') { d.setDate(1); d.setMonth(d.getMonth() + n); } else d.setDate(d.getDate() + n * (c.view === 'week' ? 7 : 1)); c.sel = ymd(d); render(); },
  toggleDone: () => { UI.showDone = !UI.showDone; render(); },
  seg: el => { UI.seg = el.dataset.v; render(); },
  startTask: el => { closeSheet(); tmStart(el.dataset.id); },
  tmPreset: el => { TM.pomo = false; TM.dur = TM.rem = +el.dataset.v * 60; render(); }, tmPomo: () => { TM.pomo = !TM.pomo; if (TM.pomo) TM.dur = TM.rem = 1500; render(); },
  tmTask: el => { TM.taskId = TM.taskId === el.dataset.id ? null : el.dataset.id; const x = S.tasks.find(y => y.id === TM.taskId); if (x) { TM.pomo = false; TM.dur = TM.rem = clamp(x.minutes, 5, 120) * 60; } render(); },
  tmStart: () => tmStart(TM.taskId), tmToggle: () => { if (TM.running) { TM.running = false; } else { TM.running = true; TM.endAt = Date.now() + TM.rem * 1000; } render(); },
  tmFinish: () => tmFinish(false),
  doneFromTimer: el => { const x = S.tasks.find(y => y.id === el.dataset.id); if (x) { x.done = true; x.doneAt = todayS(); save(); } closeSheet(); refresh(); },
  mode: el => { const m = el.dataset.v; if (m === 'quiz') return quizStart(); if (QUICK[m]) { UI.mode = null; return sendChat(QUICK[m], m); } UI.mode = UI.mode === m ? null : m; render(); const ta = $('#chatIn'); ta && ta.focus(); },
  send: () => sendChat(),
  ctx: () => { const evs = activeEvents().sort((a, b) => a.date.localeCompare(b.date)); const cur = ctxEvent(); sheet(`<h2>${t('ai_ctx')}</h2>${evs.length ? evs.map(e => `<button class="list-item" data-act="setCtx" data-id="${e.id}"><span class="lic tp-${e.type}" style="background:var(--bg);color:var(--fg)">${ic(e.type)}</span><div class="grow"><b>${esc(e.subject)}</b><div class="xs muted">${esc(e.title)}</div></div>${cur && cur.id === e.id ? ic('check', 20) : ''}</button>`).join('') : `<div class="muted">${t('no_exams_d')}</div>`}`); },
  setCtx: el => { UI.ctxId = el.dataset.id; closeSheet(); render(false); },
  quizFor: el => quizStart(el.dataset.id), quizStart: () => quizStart(UI.quiz ? UI.quiz.evId : null),
  quizPick: el => { const q = UI.quiz; if (q.picked !== null) return; q.picked = +el.dataset.v; q.answers[q.i] = q.picked; if (q.picked === q.qs[q.i].answer) q.score++; render(); },
  quizNext: () => { const q = UI.quiz; if (q.i + 1 < q.qs.length) { q.i++; q.picked = null; render(); $('#view').scrollTop = 0; } else quizFinish(); },
  quizExit: () => { UI.quiz = null; render(); },
  settings: () => settingsPage(null), setPage: el => settingsPage(el.dataset.v),
  theme: el => { S.prefs.theme = el.dataset.v; save(); applyTheme(); settingsPage('appearance'); },
  notifSw: async el => { const k = el.dataset.k, n = S.prefs.notif; if (k === 'enabled' && !n.enabled) { try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); if ('Notification' in window && Notification.permission === 'denied') toast(t('n_denied')); } catch (e) { } } n[k] = !n[k]; save(); settingsPage('notifications'); },
  notifTest: () => notify(t('n_test_body')),
  delSlot: el => { S.prefs.slots.splice(+el.dataset.i, 1); save(); settingsPage('availability'); }, addSlot: () => { S.prefs.slots.push({ s: '18:00', e: '19:00' }); save(); settingsPage('availability'); },
  schedDay: el => { UI.schedDay = +el.dataset.v; settingsPage('schedule'); },
  addAct: el => { const k = +el.dataset.v; S.schedule.push({ id: uid(), day: UI.schedDay ?? new Date().getDay(), kind: k, name: t('act_kinds')[k], s: '16:00', e: '17:00' }); save(); settingsPage('schedule'); },
  delAct: el => { S.schedule = S.schedule.filter(a => a.id !== el.dataset.id); save(); settingsPage('schedule'); },
  aiSw: () => { S.prefs.ai.enabled = !S.prefs.ai.enabled; save(); settingsPage('aiprefs'); }, aiStyle: el => { S.prefs.ai.style = el.dataset.v; save(); settingsPage('aiprefs'); },
  clearDemo: () => { clearDemo(); save(); settingsPage('privacy'); render(); toast(t('clear_demo') + ' ✓'); },
  resetAll: () => confirmDlg(t('reset_all') + '?', t('yes_del'), () => { Store.clear(); location.reload(); }),
  signup: () => { const m = ($('#a_mail') || {}).value || '', p = ($('#a_pw') || {}).value || ''; if (!/^\S+@\S+\.\S+$/.test(m) || p.length < 6) { $('#aerr').textContent = 'אימייל תקין וסיסמה של 6 תווים לפחות'; return; } S.user.account = { email: m }; save(); settingsPage('account'); },
  logout: () => { S.user.account = null; save(); settingsPage('account'); },
  obNext: () => { OB.step++; showLayer('ob', obHTML()); }, obBack: () => { OB.step = 2; showLayer('ob', obHTML()); }, obSkip: () => { OB.step = 3; showLayer('ob', obHTML()); },
  obTime: el => { OB.time = +el.dataset.v; showLayer('ob', obHTML()); },
  obDone: () => { S.prefs.varies = OB.time === 0; if (OB.time) S.prefs.dailyMinutes = OB.time; S.onboarded = true; seedDemo(); autoResched(); saveNow(); hideLayer('ob'); UI.tab = 'today'; render(false); toast(t('demo_loaded'), null, null, 6000); }
};
function runOptimize() {
  const r = optimizeSchedule(); save(); refresh();
  if (r.moved.length) { S.notice = { type: 'resched', date: todayS(), moved: r.moved }; save(); toast(`${t('upd_title')} · ${r.moved.length}`, t('view_plan_upd'), movedSheet, 5000); }
  else toast(r.still.length ? t('plan_over') : t('upd_none'), null, null, 5000);
}
function notify(body) { try { if ('Notification' in window && Notification.permission === 'granted') { new Notification('StudyFlow', { body }); return; } } catch (e) { } toast(body, null, null, 4500); }
function autoResched() {
  const mv = reschedulePlan(); if (mv.length) { S.notice = { type: 'resched', date: todayS(), moved: mv }; save(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.dataset.act === undefined) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#confirm')) hideLayer('confirm'); else if ($('#modal') && !$('#ob')) ACT.closeModal(); else if ($('#sheet')) closeSheet(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.f) F[el.dataset.f] = el.value;
  if (el.dataset.s) { const k = el.dataset.s; if (k === 'name' || k === 'grade') S.user[k] = el.value; else S.prefs[k] = el.value; save(); }
  if (el.dataset.slot !== undefined) { S.prefs.slots[+el.dataset.slot][el.dataset.side] = el.value; save(); }
  if (el.dataset.actIn) { const a = S.schedule.find(x => x.id === el.dataset.id); if (a) { const k = el.dataset.actIn; if (k === 'actname') a.name = el.value; if (k === 'acts') a.s = el.value; if (k === 'acte') a.e = el.value; save(); } }
});
window.addEventListener('online', () => { UI.offline = false; renderBanner(); });
window.addEventListener('offline', () => { UI.offline = true; renderBanner(); });
let lastDay = todayS();
function dayCheck() { if (todayS() !== lastDay) { lastDay = todayS(); autoResched(); UI.cal.sel = lastDay; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { dayCheck(); if (!$('#modal') && !$('#sheet') && !UI.busy) render(); } });
setInterval(dayCheck, 60000);

/* ---------- boot ---------- */
function boot() {
  document.documentElement.lang = LANG; document.documentElement.dir = 'rtl'; applyTheme();
  if (!S.onboarded) { renderNav(); $('#fab').innerHTML = ic('plus', 28); showLayer('ob', obHTML()); return; }
  autoResched(); render(false);
  try { if (S.prefs.notif.enabled && 'Notification' in window && Notification.permission === 'granted' && S.lastNotif !== todayS()) { const n = tasksOn(todayS()).filter(x => !x.done).length; if (n) { S.lastNotif = todayS(); save(); notify(`📚 יש לך ${n} משימות להיום`); } } } catch (e) { }
}
window.addEventListener('pagehide', saveNow);
boot();
</script>
